services:
  - type: web
    name: media-downloader-bot
    runtime: docker
    plan: free
    region: frankfurt
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: STORAGE_DIR
        value: /data/storage
      - key: RETENTION_HOURS
        value: "3"
      - key: CLEANUP_INTERVAL_SECONDS
        value: "300"
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "1"
      - key: MAX_UPLOAD_MB
        value: "49"
      - key: MAX_URLS_PER_MESSAGE
        value: "5"
      - key: USER_COOLDOWN_SECONDS
        value: "5"
      - key: MAX_VIDEO_DURATION_SECONDS
        value: "3600"
      - key: REMOVE_USERNAME
        value: "true"
      - key: USERNAME_OCR_FRAMES
        value: "10"
      - key: USERNAME_MAX_SECONDS
        value: "600"
      - key: USERNAME_OCR_WIDTH
        value: "1280"
      - key: USERNAME_OCR_MIN_SCORE
        value: "0.25"
      - key: USERNAME_RISK_THRESHOLD
        value: "0.45"
      - key: USERNAME_OFFER_MANUAL
        value: "true"
      - key: ALLOWED_PLATFORMS
        value: "tiktok,instagram,facebook"
      - key: LOG_LEVEL
        value: INFO
